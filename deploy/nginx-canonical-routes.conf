# Include inside the apex domain server block, before its existing SPA location.
# Use these only if the production server is Nginx (Apache uses public/.htaccess).
location = /psicoanalista-olivos { return 301 /psicologo-olivos$is_args$args; }
location = /psicoanalista-olivos/ { return 301 /psicologo-olivos$is_args$args; }
location ~ ^(/.+)/$ { return 301 $1$is_args$args; }
